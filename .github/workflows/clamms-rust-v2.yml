name: CLAMMS Rust V2

on:
  push:
    branches: [rust-v2]
    paths:
      - 'rust-v2/**'
      - '.github/workflows/clamms-rust-v2.yml'
  pull_request:
    branches: [rust-v2]
    paths:
      - 'rust-v2/**'
      - '.github/workflows/clamms-rust-v2.yml'

concurrency:
  group: clamms-rust-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Compile
        run: cargo check
      - name: Run tests
        run: cargo test
      - name: Run Clippy
        run: cargo clippy --all-targets
      - name: Format Windows agent
        run: cargo fmt --manifest-path agent/Cargo.toml --all
      - name: Compile Windows agent
        run: cargo check --manifest-path agent/Cargo.toml
      - name: Test Windows agent
        run: cargo test --manifest-path agent/Cargo.toml
      - name: Run agent Clippy
        run: cargo clippy --manifest-path agent/Cargo.toml --all-targets
      - name: Build server executable
        run: cargo build --release
      - name: Build agent executable
        run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: clamms-windows-x64
          path: |
            rust-v2/target/release/clamms-server.exe
            rust-v2/agent/target/release/clamms-agent.exe
          if-no-files-found: error
          retention-days: 14
