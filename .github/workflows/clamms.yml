name: CLAMMS

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'static/**'
      - 'agent/**'
      - 'migrations/**'
      - '*.ps1'
      - '.github/workflows/clamms.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'static/**'
      - 'agent/**'
      - 'migrations/**'
      - '*.ps1'
      - '.github/workflows/clamms.yml'

permissions:
  contents: write

concurrency:
  group: clamms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Apply Rust formatting
        run: |
          cargo fmt --all
          cargo fmt --manifest-path agent/Cargo.toml --all
      - name: Commit formatting fixes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.rs agent/src/main.rs
            git commit -m "chore: format Rust server and agent"
            git push
          }
      - name: Compile
        run: cargo check
      - name: Run tests
        run: cargo test
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format Windows agent
        run: cargo fmt --manifest-path agent/Cargo.toml --all -- --check
      - name: Compile Windows agent
        run: cargo check --manifest-path agent/Cargo.toml
      - name: Test Windows agent
        run: cargo test --manifest-path agent/Cargo.toml
      - name: Run agent Clippy
        run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - name: Build server executable
        run: cargo build --release
      - name: Build agent executable
        run: cargo build --release --manifest-path agent/Cargo.toml
      - name: Package Windows deployment bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "clamms-windows-x64"
          New-Item -ItemType Directory -Force -Path "$bundle\server","$bundle\agent" | Out-Null
          Copy-Item "target\release\clamms-server.exe" "$bundle\server\"
          Copy-Item ".env.example","install-server.ps1","uninstall-server.ps1","backup-database.ps1","restore-database.ps1" "$bundle\server\"
          Copy-Item "agent\target\release\clamms-agent.exe" "$bundle\agent\"
          Copy-Item "agent\.env.example","agent\install-agent.ps1","agent\uninstall-agent.ps1" "$bundle\agent\"
          Compress-Archive -Path "$bundle\*" -DestinationPath "clamms-windows-x64.zip" -Force
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: clamms-windows-x64
          path: |
            target/release/clamms-server.exe
            agent/target/release/clamms-agent.exe
            clamms-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
