<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAMMS | Laboratory Asset Management</title>
<style>
:root{font:15px "Segoe UI",system-ui,sans-serif;color:#182538;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}header{background:#142b46;color:white;padding:16px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:21px;letter-spacing:1px}main{max-width:1200px;margin:26px auto;padding:0 16px}.panel{background:white;border:1px solid #dce3ed;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #142b4608}h1,h2{margin:0 0 14px}h1{font-size:24px}h2{font-size:18px}.muted,small{color:#64748b}.hidden{display:none!important}input,select,textarea,button{font:inherit;padding:10px 11px;border:1px solid #cbd5e1;border-radius:7px}input,select,textarea{width:100%;margin:5px 0 12px;background:white}textarea{min-height:72px}button{background:#1e4d7a;color:white;border:0;cursor:pointer}button.secondary{background:#e6edf5;color:#1c3047}button.danger{background:#a83434}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:#e4ebf4;color:#172d45}.nav button.active{background:#1e4d7a;color:white}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{background:#eef3f8;padding:14px;border-radius:9px}.stat strong{display:block;font-size:25px;margin-top:6px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5eaf0;vertical-align:top}th{background:#f7f9fc}.tablewrap{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field label{font-size:13px;font-weight:600;color:#40536a}.status{font-size:12px;border-radius:20px;padding:4px 8px;background:#e9eff6}.notice{margin-top:10px;color:#a33131;min-height:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar input{max-width:300px;margin:0}.modal{position:fixed;inset:0;background:#10243bb8;display:grid;place-items:center;padding:16px;z-index:4}.dialog{background:white;border-radius:12px;padding:22px;width:min(700px,100%);max-height:90vh;overflow:auto}
</style></head><body>
<header><strong>CLAMMS</strong><span>Computer Laboratory Asset &amp; Maintenance Management</span></header>
<main>
<section id="login" class="panel" style="max-width:430px;margin:8vh auto"><h1>Sign in</h1><p class="muted">Use your assigned CLAMMS account.</p>
<form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button>Sign in</button></form><p id="loginError" class="notice" role="alert"></p></section>
<section id="application" class="hidden">
<div class="panel"><div class="toolbar"><div><h1>Dashboard</h1><span id="identity" class="muted"></span></div><button id="logout" class="secondary">Sign out</button></div>
<div class="stats"><div class="stat">Assets<strong id="assetCount">—</strong></div><div class="stat">Laboratories<strong id="labCount">—</strong></div><div class="stat">Maintenance<strong id="maintenanceCount">—</strong></div><div class="stat">Needs attention<strong id="attentionCount">—</strong></div></div>
<nav class="nav"><button data-view="assets" class="active">Assets</button><button data-view="laboratories">Laboratories</button><button data-view="maintenance">Maintenance</button><button data-view="monitoring">Monitoring</button><button data-view="users" id="usersTab" class="hidden">Users</button></nav></div>
<div class="panel"><div class="toolbar"><h2 id="viewTitle">Assets</h2><div class="actions"><input id="search" placeholder="Search records…" aria-label="Search records"><button id="addRecord">Add record</button></div></div><p id="message" class="notice"></p><div id="records" class="tablewrap">Loading…</div></div>
</section></main>
<div id="modal" class="modal hidden"><div class="dialog"><div class="toolbar"><h2 id="formTitle">Add record</h2><button id="closeModal" class="secondary" type="button">Close</button></div><form id="recordForm"><div id="formFields" class="grid"></div><p id="formError" class="notice"></p><div class="actions"><button type="submit">Save</button><button id="cancelForm" class="secondary" type="button">Cancel</button></div></form></div></div>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('clamms_token')||'',me=null,view='assets',records=[],labs=[],editing=null;
const canInventory=()=>me&&['administrator','custodian'].includes(me.role),canMaintenance=()=>me&&['administrator','custodian','technician'].includes(me.role);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch('/api/'+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.message||'Request failed ('+r.status+')');return data}
const cols={assets:['id','asset_tag','laboratory_id','brand','model','status','category_id','serial_number','hostname','ip_address','purchase_date','warranty_end','notes'],laboratories:['id','code','name','location','description'],maintenance:['id','asset_id','issue','action_taken','status','reported_at'],monitoring:['id','asset_tag','hostname','os_version','cpu_percent','memory_percent','disk_free_bytes','uptime_seconds','received_at'],users:['id','full_name','username','role','is_active']};
function mayWrite(){return view==='assets'||view==='laboratories'?canInventory():view==='maintenance'?canMaintenance():view==='monitoring'?false:me?.role==='administrator'}
async function load(){try{labs=await api('laboratories');const [a,m]=await Promise.all([api('assets'),api('maintenance')]);$('assetCount').textContent=a.length;$('labCount').textContent=labs.length;$('maintenanceCount').textContent=m.length;$('attentionCount').textContent=a.filter(x=>['needs_repair','under_maintenance','missing'].includes(x[5])).length;
records=view==='assets'?a:view==='laboratories'?labs:view==='maintenance'?m:view==='monitoring'?await api('monitoring'):await api('users');render()}catch(e){$('message').textContent=e.message}}
function render(){const headers=cols[view];$('viewTitle').textContent=view[0].toUpperCase()+view.slice(1);$('addRecord').classList.toggle('hidden',!mayWrite());const q=$('search').value.toLowerCase();const filtered=records.filter(r=>r.some(v=>String(v??'').toLowerCase().includes(q)));$('records').innerHTML=filtered.length?'<table><thead><tr>'+headers.map(h=>'<th>'+esc(h.replaceAll('_',' '))+'</th>').join('')+'<th>Action</th></tr></thead><tbody>'+filtered.map((r,i)=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'<td>'+(mayWrite()?'<button class="secondary" data-edit="'+i+'">Edit</button>':'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No matching records.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',async()=>{if(view==='maintenance')await refreshCache();openForm(filtered[Number(b.dataset.edit)])}))}
function field(name,label,type='text',value='',opts=[]){let html='<div class="field"><label>'+esc(label)+'</label>';if(type==='select')html+='<select name="'+name+'" required>'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(String(value)===String(o[0])?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';else if(type==='textarea')html+='<textarea name="'+name+'">'+esc(value)+'</textarea>';else html+='<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(['asset_tag','code','name','full_name','username','issue'].includes(name)?'required':'')+'>';return html+'</div>'}
function openForm(row=null){editing=row;$('formError').textContent='';$('formTitle').textContent=(row?'Edit ':'Add ')+view;$('formFields').innerHTML='';let f='';
if(view==='assets'){f+=field('asset_tag','Asset tag','text',row?.[1]||'')+field('laboratory_id','Laboratory','select',row?.[2]||labs[0]?.[0],labs.map(x=>[x[0],x[1]+' — '+x[2]]))+field('brand','Brand','text',row?.[3]||'')+field('model','Model','text',row?.[4]||'')+field('status','Status','select',row?.[5]||'working',['working','needs_repair','under_maintenance','retired','missing'].map(x=>[x,x.replaceAll('_',' ')]))+field('serial_number','Serial number','text',row?.[7]||'')+field('hostname','Hostname','text',row?.[8]||'')+field('ip_address','IP address','text',row?.[9]||'')+field('category_id','Category ID','number',row?.[6]||'')+field('purchase_date','Purchase date','date',row?.[10]||'')+field('warranty_end','Warranty end','date',row?.[11]||'')+field('notes','Notes','textarea',row?.[12]||'')}
if(view==='laboratories')f+=field('code','Code','text',row?.[1]||'')+field('name','Name','text',row?.[2]||'')+field('location','Location','text',row?.[3]||'')+field('description','Description','textarea',row?.[4]||'');
if(view==='maintenance')f+=field('asset_id','Asset','select',row?.[1]||'',(awaitAssets()).map(x=>[x[0],x[1]]))+field('issue','Issue','textarea',row?.[2]||'')+field('action_taken','Action taken','textarea',row?.[3]||'')+field('status','Status','select',row?.[4]||'open',['open','in_progress','resolved','cancelled'].map(x=>[x,x.replaceAll('_',' ')]));
if(view==='users')f+=field('full_name','Full name','text',row?.[1]||'')+field('username','Username','text',row?.[2]||'')+field('role','Role','select',row?.[3]||'viewer',['administrator','custodian','technician','viewer'].map(x=>[x,x]))+field('is_active','Account status','select',row?String(row[4]):'1',[['1','Active'],['0','Inactive']])+field('password','New password (12+ characters)','password');
$('formFields').innerHTML=f;$('modal').classList.remove('hidden')}
function awaitAssets(){return assetCache}
let assetCache=[];
async function refreshCache(){assetCache=await api('assets')}
$('addRecord').addEventListener('click',async()=>{try{if(view==='maintenance')await refreshCache();openForm()}catch(e){$('message').textContent=e.message}});
async function save(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());let path=view,method=editing?'PUT':'POST';if(view==='assets'){d.laboratory_id=Number(d.laboratory_id);for(const k of ['category_id'])d[k]=d[k]?Number(d[k]):null;for(const k of ['serial_number','hostname','ip_address','purchase_date','warranty_end','notes','brand','model'])d[k]=d[k]||null}
if(view==='maintenance')d.asset_id=Number(d.asset_id);
if(view==='users'){d.is_active=d.is_active==='1';if(!d.password)d.password=null}
if(editing){const id=editing[0];path+='/'+id;if(view==='maintenance')d.asset_id=Number(d.asset_id)}
try{await api(path,{method,body:JSON.stringify(d)});$('modal').classList.add('hidden');$('message').textContent='Saved successfully.';await load()}catch(err){$('formError').textContent=err.message}}
async function enter(){try{me=await api('auth/me');$('identity').textContent=me.full_name+' · '+me.role;$('usersTab').classList.toggle('hidden',me.role!=='administrator');$('login').classList.add('hidden');$('application').classList.remove('hidden');await load()}catch(e){token='';sessionStorage.removeItem('clamms_token');$('loginError').textContent='Please sign in again.'}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Sign in failed');token=d.token;sessionStorage.setItem('clamms_token',token);$('password').value='';await enter()}catch(err){$('loginError').textContent=err.message}});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',async()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));await load()}));
$('search').addEventListener('input',render);$('recordForm').addEventListener('submit',save);
function close(){ $('modal').classList.add('hidden') }$('closeModal').addEventListener('click',close);$('cancelForm').addEventListener('click',close);
$('logout').addEventListener('click',async()=>{try{await api('auth/logout',{method:'POST'})}catch{}token='';me=null;sessionStorage.removeItem('clamms_token');$('application').classList.add('hidden');$('login').classList.remove('hidden')});
if(token)enter();
</script></body></html>
