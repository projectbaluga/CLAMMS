<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAMMS | Laboratory Asset Management</title>
<style>
:root{font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;color:#172b42;background:#f4f7fb;--navy:#10283f;--navy2:#173b59;--teal:#12a99a;--ink:#172b42;--muted:#718096;--line:#e3eaf1;--surface:#fff;--shadow:0 12px 32px rgba(16,40,63,.07)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,#dcefeb 0,transparent 34%),#f4f7fb;color:var(--ink)}button,input,select,textarea{font:inherit}button{padding:10px 15px;border:1px solid transparent;border-radius:9px;background:var(--navy2);color:#fff;font-weight:650;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}button:hover{background:#205477;box-shadow:0 5px 14px #10283f20}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #12a99a55;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}button.secondary{background:#edf3f7;color:#29445c;border-color:#dce6ee}button.secondary:hover{background:#e2edf2}button.danger{background:#a83434}
header{min-height:76px;background:linear-gradient(110deg,#10283f,#19445f);color:white;padding:14px max(4vw,20px);display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 4px 18px #10283f20}header strong{font-size:23px;letter-spacing:1.8px;display:flex;align-items:center;gap:11px}header strong:before{content:"C";display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#19b7a6,#1783a0);font-size:21px;color:white;letter-spacing:0}header span{font-size:13px;color:#c3d5e2;letter-spacing:.2px}
main{max-width:1380px;margin:32px auto;padding:0 26px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}#login{max-width:440px;margin:9vh auto!important;padding:34px}#login h1{font-size:28px;letter-spacing:-.8px}#login:before{content:"CLAMMS · SECURE WORKSPACE";display:block;color:#0c9489;font-size:11px;font-weight:800;letter-spacing:1.6px;margin-bottom:18px}
h1,h2{margin:0 0 12px;letter-spacing:-.45px}h1{font-size:27px;font-weight:750}h2{font-size:18px;font-weight:700}.muted,small{color:var(--muted)}.hidden{display:none!important}
input,select,textarea{width:100%;margin:6px 0 13px;padding:11px 12px;background:#fbfdff;border:1px solid #d7e1ea;border-radius:9px;color:var(--ink);transition:border .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{border-color:#25a99b;box-shadow:0 0 0 3px #25a99b18;outline:0}textarea{min-height:82px;resize:vertical}.field label{font-size:12px;font-weight:750;color:#53677b;letter-spacing:.25px}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 0;padding-top:17px;border-top:1px solid var(--line)}.nav button{background:transparent;color:#5b7084;border:1px solid transparent;padding:9px 13px;font-size:13px}.nav button:hover{background:#f0f6f7;box-shadow:none}.nav button.active{background:#e5f5f2;color:#087f76;border-color:#c9eae4}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:22px}.stat{position:relative;overflow:hidden;background:linear-gradient(145deg,#f6fafb,#edf4f7);padding:17px 18px;border:1px solid #e4edf0;border-radius:13px;color:#617487;font-size:13px;font-weight:650}.stat:after{content:"";position:absolute;width:64px;height:64px;border-radius:50%;right:-20px;top:-25px;background:#12a99a12}.stat strong{display:block;font-size:29px;line-height:1.2;margin-top:8px;color:#163b54;font-weight:760;letter-spacing:-1px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:660px;font-size:13px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #eaf0f4;vertical-align:middle}th{background:#f5f8fa;color:#63778a;font-size:11px;text-transform:uppercase;letter-spacing:.65px;font-weight:800;position:sticky;top:0}th:first-child{border-radius:9px 0 0 0}th:last-child{border-radius:0 9px 0 0}tbody tr:hover{background:#f8fbfc}.tablewrap{overflow:auto;border:1px solid #e7edf2;border-radius:11px;min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.status{font-size:12px;border-radius:20px;padding:4px 9px;background:#e9eff6}.notice{margin-top:10px;color:#a33131;min-height:20px;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.toolbar input{max-width:270px;margin:0}.toolbar h2{margin:0}.modal{position:fixed;inset:0;background:#0c2038b8;backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:4}.dialog{background:white;border:1px solid #e4ebf1;border-radius:18px;padding:26px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #071b3040}.dialog .toolbar{margin-bottom:18px}
#application>.panel:first-child{padding:25px 27px 18px}#application>.panel:nth-child(2){padding:24px 25px 26px}#identity{font-size:13px}.notice:empty{display:none}
@media(max-width:760px){header{align-items:flex-start;flex-direction:column;gap:3px;padding:13px 18px}header span{font-size:11px}main{padding:0 13px;margin:18px auto}.panel{padding:17px;border-radius:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px}.stat strong{font-size:25px}.nav{gap:5px}.nav button{padding:8px 10px;font-size:12px}.toolbar{align-items:stretch}.toolbar>div.actions{width:100%}.toolbar input{max-width:none;flex:1;min-width:160px}#login{margin:7vh auto!important;padding:25px}.dialog{padding:19px}}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.actions button{flex:1}.toolbar>div.actions button{flex:1}h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
.toolbar .actions{gap:8px}.toolbar .actions input{min-width:190px}.toolbar .actions select{width:auto;min-width:130px;margin:0}.status{display:inline-block;text-transform:capitalize;font-size:11px;font-weight:650;padding:5px 9px;border-radius:20px;background:#edf3f7;color:#38536a}#pagination button{padding:7px 11px;font-size:12px}#pagination select{padding:6px 8px}@media(max-width:760px){.toolbar .actions{width:100%}.toolbar .actions input{flex:1;min-width:140px}.toolbar .actions select{min-width:110px}#pagination{align-items:flex-start;flex-direction:column}#pagination .actions{width:100%;justify-content:space-between}}#monitoringSummary{margin:18px 0 22px}.monitor-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}.monitor-head strong{font-size:25px;color:#163b54}.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.device-card{border:1px solid #e4ebf0;border-radius:13px;padding:15px;background:linear-gradient(145deg,#fff,#f8fbfc);min-width:0}.device-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:15px}.device-top strong{overflow-wrap:anywhere;color:#193b54}.device-top .muted{font-size:12px;overflow-wrap:anywhere}.health{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;white-space:nowrap}.health.healthy{background:#e5f5ef;color:#147454}.health.warning{background:#fff4dc;color:#94620c}.health.critical{background:#fde9e7;color:#a12d2d}.metric{margin:11px 0}.metric-head{display:flex;justify-content:space-between;font-size:12px;color:#63778a;margin-bottom:5px}.metric-head strong{color:#26445c}.meter{height:8px;background:#eaf0f3;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#19a99a,#247a9a);border-radius:10px}.device-meta{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f4;padding-top:10px;margin-top:12px;font-size:11px;color:#718096}.device-meta strong{display:block;color:#29475e;font-size:12px}.device-seen{font-size:10px;color:#8392a1;margin-top:10px;overflow-wrap:anywhere}.maintenance-alerts{margin-top:18px;padding:15px 17px;border:1px solid #f0e2c8;border-radius:12px;background:#fffaf1}.maintenance-alerts h2{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 9px}.maintenance-alerts ul{margin:0;padding-left:19px}.maintenance-alerts li{padding:5px 0;color:#42586c;font-size:13px}.maintenance-alerts .alert-status{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:12px;background:#fff0d3;color:#8a5b10;font-size:10px;font-weight:750;text-transform:capitalize}.maintenance-alerts .empty{color:#718096;font-size:13px;margin:0}@media(max-width:480px){.device-grid{grid-template-columns:1fr}.device-meta{font-size:10px}}</style></head><body>
<header><strong>CLAMMS</strong><span>Computer Laboratory Asset &amp; Maintenance Management System</span></header>
<main>
<section id="login" class="panel" style="max-width:430px;margin:8vh auto"><h1>Sign in</h1><p class="muted">Sign in to manage laboratory assets, maintenance, and device health.</p>
<form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button>Sign in</button></form><p id="loginError" class="notice" role="alert"></p></section>
<section id="application" class="hidden">
<div class="panel"><div class="toolbar"><div><div><h1>Overview</h1><span id="identity" class="muted"></span></div></div><button id="logout" class="secondary">Sign out</button></div>
<div class="stats"><div class="stat">Assets<strong id="assetCount">—</strong></div><div class="stat">Laboratories<strong id="labCount">—</strong></div><div class="stat">Maintenance<strong id="maintenanceCount">—</strong></div><div class="stat">Needs attention<strong id="attentionCount">—</strong></div></div><section id="maintenanceAlerts" class="maintenance-alerts" aria-live="polite"><h2>Open maintenance work</h2><p class="empty">Loading maintenance status…</p></section>
<nav class="nav"><button data-view="assets" class="active">Assets</button><button data-view="laboratories">Laboratories</button><button data-view="maintenance">Maintenance</button><button data-view="monitoring">Monitoring</button><button data-view="audit" id="auditTab" class="hidden">Audit log</button><button data-view="users" id="usersTab" class="hidden">Users</button></nav></div>
<div class="panel"><div class="toolbar"><h2 id="viewTitle">Assets</h2><div class="actions"><button id="backupDb" class="secondary hidden">Download DB backup</button><input id="search" placeholder="Search records…" aria-label="Search records"><select id="statusFilter" aria-label="Filter by status" class="secondary hidden"><option value="">All statuses</option></select><button id="exportCsv" class="secondary">Export CSV</button><button id="addRecord">Add record</button></div></div><p id="message" class="notice"></p><div id="monitoringSummary" class="hidden"></div><div id="records" class="tablewrap" aria-live="polite">Loading…</div><div id="pagination" class="toolbar" style="margin-top:14px"></div></div>
</section></main>
<div id="modal" class="modal hidden"><div class="dialog"><div class="toolbar"><h2 id="formTitle">Add record</h2><button id="closeModal" class="secondary" type="button">Close</button></div><form id="recordForm"><div id="formFields" class="grid"></div><p id="formError" class="notice"></p><div class="actions"><button type="submit">Save</button><button id="cancelForm" class="secondary" type="button">Cancel</button></div></form></div></div>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('clamms_token')||'',me=null,view='assets',records=[],labs=[],editing=null,page=1,pageSize=10,sortCol=1,sortDir=1,monitorTimer=null,monitorBusy=false;
const canInventory=()=>me&&['administrator','custodian'].includes(me.role),canMaintenance=()=>me&&['administrator','custodian','technician'].includes(me.role);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch('/api/'+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.message||'Request failed ('+r.status+')');return data}
const cols={assets:['id','asset_tag','laboratory_id','brand','model','status','category_id','serial_number','hostname','ip_address','purchase_date','warranty_end','notes'],laboratories:['id','code','name','location','description'],maintenance:['id','asset_id','issue','action_taken','status','reported_at'],monitoring:['id','asset_tag','hostname','os_version','cpu_percent','memory_percent','disk_free_bytes','uptime_seconds','received_at'],audit:['id','full_name','action','entity_type','entity_id','details','created_at'],users:['id','full_name','username','role','is_active']};
function mayWrite(){return view==='assets'||view==='laboratories'?canInventory():view==='maintenance'?canMaintenance():view==='monitoring'||view==='audit'?false:me?.role==='administrator'}
function renderMaintenanceAlerts(items){const pending=items.filter(r=>['open','in_progress'].includes(String(r[4]??'').toLowerCase()));const recent=pending.slice(0,5);$('maintenanceAlerts').innerHTML='<h2><span>Open maintenance work</span><span class="muted" style="font-size:12px;font-weight:600">'+pending.length+' pending</span></h2>'+(recent.length?'<ul>'+recent.map(r=>'<li><strong>#'+esc(r[0])+'</strong> · Asset #'+esc(r[1])+' · '+esc(r[2]||'Issue not specified')+' <span class="alert-status">'+esc(String(r[4]).replaceAll('_',' '))+'</span></li>').join('')+'</ul>'+(pending.length>5?'<p class="empty" style="margin-top:8px">+'+(pending.length-5)+' more pending work orders.</p>':''):'<p class="empty">No open or in-progress maintenance work orders.</p>')}
async function load(){try{labs=await api('laboratories');const [a,m]=await Promise.all([api('assets'),api('maintenance')]);$('assetCount').textContent=a.length;$('labCount').textContent=labs.length;$('maintenanceCount').textContent=m.length;$('attentionCount').textContent=a.filter(x=>['needs_repair','under_maintenance','missing'].includes(x[5])).length;renderMaintenanceAlerts(m);
records=view==='assets'?a:view==='laboratories'?labs:view==='maintenance'?m:view==='monitoring'?await api('monitoring'):view==='audit'?await api('audit'):await api('users');render()}catch(e){$('message').textContent=e.message}}
async function refreshMonitoring(){if(monitorBusy||!token||view!=='monitoring'||document.visibilityState==='hidden')return;monitorBusy=true;try{records=await api('monitoring');render()}catch(e){$('message').textContent='Monitoring refresh failed: '+e.message}finally{monitorBusy=false}}
function syncMonitoringRefresh(){if(monitorTimer){clearInterval(monitorTimer);monitorTimer=null}if(token&&view==='monitoring')monitorTimer=setInterval(refreshMonitoring,30000)}
function renderMonitoring(){
 const latest=new Map();
 records.forEach(r=>{if(!latest.has(r[1]))latest.set(r[1],r)});
 const devices=[...latest.values()];
 if(!devices.length){$('monitoringSummary').innerHTML='<p class="muted">No agent heartbeats have been received yet. Install and configure the CLAMMS agent on registered workstations to see live health data.</p>';return}
 const pct=v=>v==null?null:Math.max(0,Math.min(100,Number(v)));
 const bar=(label,value)=>{const n=pct(value);return '<div class="metric"><div class="metric-head"><span>'+label+'</span><strong>'+(n===null?'—':n.toFixed(1)+'%')+'</strong></div><div class="meter" role="progressbar" aria-label="'+label+'" aria-valuemin="0" aria-valuemax="100" '+(n===null?'':'aria-valuenow="'+n+'"')+'><span style="width:'+(n===null?0:n)+'%"></span></div></div>'};
 const fmtBytes=v=>{if(v==null)return '—';const units=['B','KB','MB','GB','TB'];let n=Number(v),i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+units[i]};
 const fmtUptime=v=>{if(v==null)return '—';const d=Math.floor(v/86400),h=Math.floor(v%86400/3600),m=Math.floor(v%3600/60);return (d?d+'d ':'')+h+'h '+m+'m'};
 const now=Date.now();
 $('monitoringSummary').innerHTML='<div class="monitor-head"><div><strong>'+devices.length+'</strong><span> devices reporting</span></div><span class="muted">Latest heartbeat per asset</span></div><div class="device-grid">'+devices.map(r=>{
  const cpu=pct(r[4]),mem=pct(r[5]),age=Date.parse(r[8]),minutes=Number.isFinite(age)?Math.max(0,(now-age)/60000):null;
  const critical=(cpu!==null&&cpu>=90)||(mem!==null&&mem>=90),warning=(cpu!==null&&cpu>=80)||(mem!==null&&mem>=80)||(minutes!==null&&minutes>5);
  const health=critical?'High utilization':warning?'Check device':'Reporting';
  return '<article class="device-card"><div class="device-top"><div><strong>'+esc(r[1])+'</strong><div class="muted">'+esc(r[2]||'Hostname unavailable')+'</div></div><span class="health '+(critical?'critical':warning?'warning':'healthy')+'">'+health+'</span></div>'+bar('CPU',r[4])+bar('Memory',r[5])+'<div class="device-meta"><span>Free disk <strong>'+fmtBytes(r[6])+'</strong></span><span>Uptime <strong>'+fmtUptime(r[7])+'</strong></span></div><div class="device-seen">Last seen: '+esc(r[8])+(minutes!==null?' · '+(minutes<1?'just now':Math.floor(minutes)+' min ago'):'')+'</div></article>'
 }).join('')+'</div>';
}
function render(){
 const headers=cols[view],statusIndex=view==='assets'?5:view==='maintenance'?4:-1;$('monitoringSummary').classList.toggle('hidden',view!=='monitoring');if(view==='monitoring')renderMonitoring();
 $('exportCsv').classList.toggle('hidden',!['assets','maintenance'].includes(view));
 $('statusFilter').classList.toggle('hidden',statusIndex<0);
 $('viewTitle').textContent=view[0].toUpperCase()+view.slice(1);
 $('addRecord').classList.toggle('hidden',!mayWrite());
 const q=$('search').value.toLowerCase(),status=$('statusFilter').value;
 const options=statusIndex<0?[]:[...new Set(records.map(r=>String(r[statusIndex]??'')))].filter(Boolean).sort();
 $('statusFilter').innerHTML='<option value="">All statuses</option>'+options.map(x=>'<option value="'+esc(x)+'" '+(x===status?'selected':'')+'>'+esc(x.replaceAll('_',' '))+'</option>').join('');
 const filtered=records.filter(r=>r.some(v=>String(v??'').toLowerCase().includes(q))&&(!status||String(r[statusIndex])===status));
 filtered.sort((a,b)=>String(a[sortCol]??'').localeCompare(String(b[sortCol]??''),undefined,{numeric:true,sensitivity:'base'})*sortDir);
 const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,pages);
 const start=(page-1)*pageSize,shown=filtered.slice(start,start+pageSize),statusCols={assets:5,maintenance:4,users:4};
 $('records').innerHTML=shown.length?'<table><thead><tr>'+headers.map((h,i)=>'<th><button type="button" class="secondary" data-sort="'+i+'" style="padding:3px 5px;background:transparent;border:0;color:inherit;font-size:inherit;text-transform:inherit">'+esc(h.replaceAll('_',' '))+(sortCol===i?(sortDir===1?' ↑':' ↓'):'')+'</button></th>').join('')+'<th>Action</th></tr></thead><tbody>'+shown.map((r,i)=>'<tr>'+r.map((v,j)=>'<td>'+(j===statusCols[view]?'<span class="status">'+esc(String(v??'').replaceAll('_',' '))+'</span>':esc(v))+'</td>').join('')+'<td>'+(mayWrite()?'<button class="secondary" data-edit="'+i+'">Edit</button>':'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted" style="padding:20px">'+(records.length?'No matching records.':'No records available yet.')+'</p>';
 $('pagination').innerHTML='<span class="muted">Showing '+(filtered.length?start+1:0)+'–'+Math.min(start+pageSize,filtered.length)+' of '+filtered.length+'</span><div class="actions"><label class="muted" for="pageSize" style="font-size:12px">Rows</label><select id="pageSize" style="width:auto;margin:0"><option '+(pageSize===10?'selected':'')+'>10</option><option '+(pageSize===25?'selected':'')+'>25</option><option '+(pageSize===50?'selected':'')+'>50</option></select><button class="secondary" id="prevPage" '+(page<=1?'disabled':'')+'>Previous</button><span class="muted">Page '+page+' / '+pages+'</span><button class="secondary" id="nextPage" '+(page>=pages?'disabled':'')+'>Next</button></div>';
 document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',async()=>{if(view==='maintenance')await refreshCache();openForm(shown[Number(b.dataset.edit)])}));
 document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{const col=Number(b.dataset.sort);sortDir=sortCol===col?-sortDir:1;sortCol=col;render()}));
 $('pageSize').addEventListener('change',e=>{pageSize=Number(e.target.value);page=1;render()});
 $('prevPage').addEventListener('click',()=>{page--;render()});$('nextPage').addEventListener('click',()=>{page++;render()});
}
function field(name,label,type='text',value='',opts=[]){let html='<div class="field"><label>'+esc(label)+'</label>';if(type==='select')html+='<select name="'+name+'" required>'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(String(value)===String(o[0])?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';else if(type==='textarea')html+='<textarea name="'+name+'">'+esc(value)+'</textarea>';else html+='<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(['asset_tag','code','name','full_name','username','issue'].includes(name)?'required':'')+'>';return html+'</div>'}
function openForm(row=null){editing=row;$('formError').textContent='';$('formTitle').textContent=(row?'Edit ':'Add ')+view;$('formFields').innerHTML='';let f='';
if(view==='assets'){f+=field('asset_tag','Asset tag','text',row?.[1]||'')+field('laboratory_id','Laboratory','select',row?.[2]||labs[0]?.[0],labs.map(x=>[x[0],x[1]+' — '+x[2]]))+field('brand','Brand','text',row?.[3]||'')+field('model','Model','text',row?.[4]||'')+field('status','Status','select',row?.[5]||'working',['working','needs_repair','under_maintenance','retired','missing'].map(x=>[x,x.replaceAll('_',' ')]))+field('serial_number','Serial number','text',row?.[7]||'')+field('hostname','Hostname','text',row?.[8]||'')+field('ip_address','IP address','text',row?.[9]||'')+field('category_id','Category ID','number',row?.[6]||'')+field('purchase_date','Purchase date','date',row?.[10]||'')+field('warranty_end','Warranty end','date',row?.[11]||'')+field('notes','Notes','textarea',row?.[12]||'')}
if(view==='laboratories')f+=field('code','Code','text',row?.[1]||'')+field('name','Name','text',row?.[2]||'')+field('location','Location','text',row?.[3]||'')+field('description','Description','textarea',row?.[4]||'');
if(view==='maintenance')f+=field('asset_id','Asset','select',row?.[1]||'',(awaitAssets()).map(x=>[x[0],x[1]]))+field('issue','Issue','textarea',row?.[2]||'')+field('action_taken','Action taken','textarea',row?.[3]||'')+field('status','Status','select',row?.[4]||'open',['open','in_progress','resolved','cancelled'].map(x=>[x,x.replaceAll('_',' ')]));
if(view==='users')f+=field('full_name','Full name','text',row?.[1]||'')+field('username','Username','text',row?.[2]||'')+field('role','Role','select',row?.[3]||'viewer',['administrator','custodian','technician','viewer'].map(x=>[x,x]))+field('is_active','Account status','select',row?String(row[4]):'1',[['1','Active'],['0','Inactive']])+field('password','New password (12+ characters)','password');
$('formFields').innerHTML=f;$('modal').classList.remove('hidden')}
function awaitAssets(){return assetCache}
let assetCache=[];
async function refreshCache(){assetCache=await api('assets')}
$('backupDb').addEventListener('click',async()=>{try{$('backupDb').disabled=true;$('message').textContent='Preparing a consistent database backup…';const r=await fetch('/api/admin/backup',{headers:{Authorization:'Bearer '+token}});if(!r.ok){let e={};try{e=await r.json()}catch{}throw Error(e.message||'Backup failed ('+r.status+')')}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='clamms-backup.db';a.click();URL.revokeObjectURL(url);$('message').textContent='Database backup downloaded. Store it securely.'}catch(e){$('message').textContent=e.message}finally{$('backupDb').disabled=false}});
$('exportCsv').addEventListener('click',async()=>{try{const file=view==='assets'?'reports/assets.csv':'reports/maintenance.csv';const r=await fetch('/api/'+file,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Export failed ('+r.status+')');const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=view==='assets'?'clamms-assets.csv':'clamms-maintenance.csv';a.click();URL.revokeObjectURL(url)}catch(e){$('message').textContent=e.message}});
$('addRecord').addEventListener('click',async()=>{try{if(view==='maintenance')await refreshCache();openForm()}catch(e){$('message').textContent=e.message}});
async function save(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());let path=view,method=editing?'PUT':'POST';if(view==='assets'){d.laboratory_id=Number(d.laboratory_id);for(const k of ['category_id'])d[k]=d[k]?Number(d[k]):null;for(const k of ['serial_number','hostname','ip_address','purchase_date','warranty_end','notes','brand','model'])d[k]=d[k]||null}
if(view==='maintenance')d.asset_id=Number(d.asset_id);
if(view==='users'){d.is_active=d.is_active==='1';if(!d.password)d.password=null}
if(editing){const id=editing[0];path+='/'+id;if(view==='maintenance')d.asset_id=Number(d.asset_id)}
try{await api(path,{method,body:JSON.stringify(d)});$('modal').classList.add('hidden');$('message').textContent='Saved successfully.';await load()}catch(err){$('formError').textContent=err.message}}
async function enter(){try{me=await api('auth/me');$('identity').textContent=me.full_name+' · '+me.role;$('usersTab').classList.toggle('hidden',me.role!=='administrator');$('auditTab').classList.toggle('hidden',me.role!=='administrator');$('backupDb').classList.toggle('hidden',me.role!=='administrator');$('login').classList.add('hidden');$('application').classList.remove('hidden');await load()}catch(e){token='';sessionStorage.removeItem('clamms_token');$('loginError').textContent='Please sign in again.'}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Sign in failed');token=d.token;sessionStorage.setItem('clamms_token',token);$('password').value='';await enter();syncMonitoringRefresh()}catch(err){$('loginError').textContent=err.message}});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',async()=>{view=b.dataset.view;syncMonitoringRefresh();page=1;sortCol=1;sortDir=1;$('search').value='';$('statusFilter').value='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));await load()}));
$('search').addEventListener('input',()=>{page=1;render()});$('statusFilter').addEventListener('change',()=>{page=1;render()});$('recordForm').addEventListener('submit',save);
function close(){ $('modal').classList.add('hidden') }$('closeModal').addEventListener('click',close);$('cancelForm').addEventListener('click',close);
$('logout').addEventListener('click',async()=>{try{await api('auth/logout',{method:'POST'})}catch{}token='';me=null;if(monitorTimer){clearInterval(monitorTimer);monitorTimer=null}sessionStorage.removeItem('clamms_token');$('application').classList.add('hidden');$('login').classList.remove('hidden')});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='monitoring')refreshMonitoring()});
if(token)enter().then(syncMonitoringRefresh);
</script></body></html>
